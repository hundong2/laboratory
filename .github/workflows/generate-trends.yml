name: Generate Monthly Hairstyle Trends

on:
  schedule:
    - cron: '0 0 1 * *'  # Run at 00:00 on the 1st day of every month
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Allow the workflow to write to the repository

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r hairstyle-blog/requirements.txt

    - name: Generate monthly content
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd hairstyle-blog
        python generate_article.py

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git commit -m "🎨 Auto-generated monthly hairstyle trends for $(date +'%Y년 %m월')"
        git push

    - name: No changes to commit
      if: steps.verify-changed-files.outputs.changed == 'false'
      run: echo "No changes detected, skipping commit."
